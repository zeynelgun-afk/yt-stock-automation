name: US Stock Market Daily YouTube Automation

# All times UTC. TSI = UTC+3 (no DST). NYSE close: 20:00 UTC in EDT months,
# 21:00 UTC in EST months — the long recap must be live within ~15 min of close.
on:
  schedule:
    - cron: '30 12 * * 1-5'          # Shorts #1 — 15:30 TSI (US pre-market)
    - cron: '0 17 * * 1-5'           # Shorts #2 — 20:00 TSI (mid-day)
    - cron: '30 0 * * 2-6'           # Shorts #3 (experiment) — 03:30 TSI (US evening scroll)
    - cron: '35 13 * * 1-5'          # Turbo slot — only produces if CPI/FOMC/mega-earnings day
    - cron: '5 20 * 4-10 1-5'        # Long recap, EDT months — 23:05 TSI (close +5 min)
    - cron: '5 21 * 11,12,1,2,3 1-5' # Long recap, EST months — 00:05 TSI (close +5 min)
    - cron: '0 15 * * 0'             # Weekly analytics report — Sunday 18:00 TSI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: false
        default: 'shorts'
        type: choice
        options: [shorts, long, analytics]

jobs:
  build-and-generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve pipeline mode
        id: mode
        run: |
          MODE=shorts
          case "${{ github.event.schedule }}" in
            "5 20 * 4-10 1-5"|"5 21 * 11,12,1,2,3 1-5") MODE=long ;;
            "0 15 * * 0") MODE=analytics ;;
            "35 13 * * 1-5") MODE=event-shorts ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Resolved mode: $MODE"

      - name: Run Pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          case "$MODE" in
            analytics)
              python -c "from youtube_publisher import YouTubePublisher; YouTubePublisher()"  # materialize token.json from env
              python -c "from analytics_reporter import send_weekly_report; send_weekly_report()"
              ;;
            event-shorts)
              if python main_scheduler.py event-check; then
                echo "Event day — producing extra Shorts"
                python main_scheduler.py shorts
              else
                echo "No high-impact event today — skipping turbo slot"
              fi
              ;;
            *)
              python main_scheduler.py "$MODE"
              ;;
          esac
