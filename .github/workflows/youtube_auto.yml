name: US Stock Market Daily YouTube Automation

# The analytics job commits data/channel_learnings.json back to the repo —
# CI runners are ephemeral, so the repo is the only durable store for the
# weekly learning artifact (franchise weights, word budgets, own + market
# packaging patterns) that the pipeline reads on every video run.
permissions:
  contents: write
  actions: read  # Read original run creation time for delay-safe mode selection.

# All times UTC. TSI = UTC+3 (no DST). NYSE close: 20:00 UTC in EDT months,
# 21:00 UTC in EST months — the long recap must be live within ~15 min of close.
#
# Both recap crons fire year-round. Resolve the intended firing from its cron
# and original run creation timestamp, so queue delays/retries don't skip it.
on:
  schedule:
    - cron: '30 12 * * 1-5'          # Shorts #1 — 15:30 TSI (US pre-market)
    - cron: '0 17 * * 1-5'           # Shorts #2 — 20:00 TSI (mid-day)
    - cron: '30 0 * * 2-6'           # Shorts #3 (experiment) — 03:30 TSI (US evening scroll)
    - cron: '35 13 * * 1-5'          # Turbo slot — only produces if CPI/FOMC/mega-earnings day
    - cron: '5 20 * * 1-5'           # Long recap candidate (EDT: 16:05 ET ✓ / EST: 15:05 ET ✗)
    - cron: '5 21 * * 1-5'           # Long recap candidate (EST: 16:05 ET ✓ / EDT: 17:05 ET ✗)
    - cron: '0 15 * * 0'             # Weekly analytics report — Sunday 18:00 TSI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: false
        default: 'shorts'
        type: choice
        options: [shorts, long, analytics]

# One pipeline run at a time: an infra retry or a slow long render must not
# overlap the next cron slot (shared Telegram chat, shared YouTube quota).
concurrency:
  group: yt-pipeline
  cancel-in-progress: false

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    # A wedged step must not consume the 6h default (a credential failure once
    # could hang on an interactive OAuth prompt that no one can answer)
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve pipeline mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
            export RUN_CREATED_AT
          fi
          python pipeline_schedule.py

      - name: Check pipeline reliability
        run: python -m unittest discover -s tests -v

      - name: Restore daily finance trends
        uses: actions/cache@v4
        with:
          path: data/market_trends.json
          key: finance-trends-v1-${{ steps.mode.outputs.trend_date }}

      - name: Run Pipeline
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          HIGGSFIELD_API_SECRET: ${{ secrets.HIGGSFIELD_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          case "$MODE" in
            skip)
              echo "Off-DST duplicate recap firing — nothing to do."
              ;;
            analytics)
              python -c "from youtube_publisher import YouTubePublisher; YouTubePublisher()"  # materialize token.json from env
              python -c "from analytics_reporter import send_weekly_report; send_weekly_report()"
              # Unified weekly learning: franchise weights + narration
              # calibration + own-channel lessons + market outlier patterns,
              # all persisted into one artifact
              python -c "from learning_engine import run_weekly_learning; run_weekly_learning()"
              # Persist this week's learnings — without this commit the output
              # dies with the runner and the pipeline never sees it
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add data/channel_learnings.json
              if ! git diff --cached --quiet; then
                git commit -m "chore: weekly channel learnings refresh"
                # Rebase first: a push that landed after our checkout would
                # otherwise reject this one and silently lose the refresh
                git pull --rebase origin main
                git push
              fi
              ;;
            event-shorts)
              # exit 0 = event day, 1 = quiet day, 2 = check crashed (already alerted)
              python main_scheduler.py event-check && rc=0 || rc=$?
              if [ "$rc" = "0" ]; then
                echo "Event day — producing extra Shorts"
                python main_scheduler.py shorts
              elif [ "$rc" = "2" ]; then
                echo "event-check failed — operator alerted via Telegram, skipping slot"
              else
                echo "No high-impact event today — skipping turbo slot"
              fi
              ;;
            *)
              python main_scheduler.py "$MODE"
              ;;
          esac
