name: Channel growth experiment report
on:
  schedule:
    - cron: '15 10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: growth-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read channel metrics (no generation or publication)
        env:
          YT_LOCAL_TOKEN_JSON: ${{ secrets.YT_LOCAL_TOKEN_JSON }}
        run: |
          python growth_experiment.py
          python channel_status.py
      - name: Persist report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/growth-experiment.json reports/growth-experiment.md reports/channel-status.json reports/channel-status.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh channel growth experiment report'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: channel-growth-report
          path: |
            reports/*.json
            reports/*.md
          retention-days: 30
