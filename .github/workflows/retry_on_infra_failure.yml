name: Auto-retry pipeline on infra failure

# GitHub Actions itself fails often enough to cost publishing slots (2026-08-06:
# one run got "Failed to resolve action download info: Service Unavailable", the
# next was cancelled with "job was not acquired by Runner of type hosted"). Both
# died before a single pipeline step ran. GitHub has no native auto-retry, so
# this companion workflow re-runs those — and only those.
on:
  workflow_run:
    workflows: ["US Stock Market Daily YouTube Automation"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    # run_attempt == 1 caps this at a single retry, which also stops the rerun's
    # own completion event from looping back in here.
    if: >-
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled') &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest

    steps:
      - name: Retry only if the pipeline never started
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          # A run that reached "Run Pipeline" may already have uploaded to
          # YouTube; rerunning it would publish a duplicate. Infra failures
          # leave that step with a null conclusion (never reached), so this
          # check is what separates "GitHub broke" from "our code broke".
          started=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[].steps[]? | select(.name == "Run Pipeline" and .conclusion != null)] | length')

          if [ "$started" != "0" ]; then
            echo "Pipeline step already ran — not retrying, a rerun could double-publish."
            exit 0
          fi

          # Plain rerun, not workflow_dispatch: it replays the original event so
          # github.event.schedule survives and "Resolve pipeline mode" still
          # picks the right MODE for this slot.
          echo "Run died before the pipeline started — retrying once."
          gh run rerun "$RUN_ID" --repo "$REPO"
